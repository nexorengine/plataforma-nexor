<style>
.hero-reveal{opacity:0;transform:translateY(20px);filter:blur(6px);transition:opacity 700ms cubic-bezier(0.16,1,0.3,1),transform 700ms cubic-bezier(0.16,1,0.3,1),filter 700ms cubic-bezier(0.16,1,0.3,1);}
.hero-reveal.visible{opacity:1;transform:translateY(0);filter:blur(0);}
.sr{opacity:0;transform:translateY(15px);transition:opacity 600ms cubic-bezier(0.16,1,0.3,1),transform 600ms cubic-bezier(0.16,1,0.3,1);}
.sr.visible{opacity:1;transform:translateY(0);}
.nx-capsule{transition:transform 250ms cubic-bezier(0.16,1,0.3,1),box-shadow 250ms cubic-bezier(0.16,1,0.3,1),border-color 250ms ease;}
.nx-pill.insuficiente{background:rgb(from var(--destructive) r g b / 0.1);color:var(--destructive);border:2px solid var(--destructive);font-weight:700;letter-spacing:0.02em;}
.nx-pill.mediano{background:rgba(252,163,17,0.1);color:var(--warning);border:2px solid var(--warning);font-weight:700;letter-spacing:0.02em;}
.nx-pill.satisfatorio{background:rgb(from var(--success) r g b / 0.1);color:var(--success);border:2px solid var(--success);font-weight:700;letter-spacing:0.02em;}
.nx-hero-title{font-size:26px!important;}
@media(hover:hover){.nx-capsule:hover{transform:translateY(-3px) scale(1.012)!important;box-shadow:0 8px 24px rgba(0,0,0,0.35)!important;border-color:rgba(159,203,235,0.3)!important;}}
@media(prefers-reduced-motion:reduce){.hero-reveal,.sr{opacity:1!important;transform:none!important;filter:none!important;}}

}

  #lista-areas{grid-template-columns:1fr 1fr 1fr!important;}

/* Trial warning banner */
.trial-warn{display:none;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--radius-md);margin-bottom:16px;cursor:pointer;text-decoration:none;}
.trial-warn.urgente{background:rgba(252,163,17,0.10);border:1px solid rgba(252,163,17,0.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
.trial-warn.critico{background:rgb(from var(--destructive) r g b / 0.10);border:1px solid rgb(from var(--destructive) r g b / 0.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:pulseBorder 2s ease-in-out infinite;}
@keyframes pulseBorder{0%,100%{border-color:rgb(from var(--destructive) r g b / 0.35);}50%{border-color:rgb(from var(--destructive) r g b / 0.70);}}
.trial-warn-icon{font-size:20px;flex-shrink:0;}
.trial-warn-body{flex:1;}
.trial-warn-title{font-family:var(--font-display);font-weight:700;font-size:14px;margin-bottom:2px;}
.trial-warn-sub{font-size:11px;font-weight:300;opacity:0.80;}
.trial-warn-cta{font-size:11px;font-weight:700;font-family:var(--font-sans);white-space:nowrap;padding:5px 12px;border-radius:var(--radius-sm);flex-shrink:0;}
.trial-warn.urgente .trial-warn-title{color:var(--warning);}
.trial-warn.urgente .trial-warn-sub{color:color-mix(in oklab, var(--warning) 65%, var(--muted-foreground));}
.trial-warn.urgente .trial-warn-cta{background:var(--warning);color:var(--background);}
.trial-warn.critico .trial-warn-title{color:var(--destructive);}
.trial-warn.critico .trial-warn-sub{color:color-mix(in oklab, var(--destructive) 65%, var(--muted-foreground));}
.trial-warn.critico .trial-warn-cta{background:var(--destructive);color:var(--foreground);}

<script>
// Protege a rota — redireciona para login se não autenticado, para upgrade se sem plano
(async () => {
  const s = await Auth.requireAuth();
  if (!s) return;
  await Auth.requireAccess();
  await Auth.fillHeader();

  // Exibe aviso de trial quando faltam ≤2 dias
  const sub = await Auth.subscription();
  if (sub && sub.plan === 'trial' && sub.trial_ends_at) {
    const dias = Math.ceil((new Date(sub.trial_ends_at) - new Date()) / 86400000);
    const banner = document.getElementById('trial-warn-banner');
    const titulo = document.getElementById('trial-warn-title');
    const sub_txt = document.getElementById('trial-warn-sub');
    if (dias <= 0) {
      // não deve chegar aqui (requireAccess redireciona), mas por segurança
    } else if (dias === 1) {
      banner.classList.add('critico');
      titulo.textContent = 'Último dia do seu trial!';
      sub_txt.textContent = 'Assine agora para não perder seu progresso.';
      banner.style.display = 'flex';
    } else if (dias === 2) {
      banner.classList.add('urgente');
      titulo.textContent = 'Faltam 2 dias no seu trial';
      sub_txt.textContent = 'Garanta seu acesso antes de expirar.';
      banner.style.display = 'flex';
    }
  }
})();
</script>
<script>
const el = document.getElementById('lista-areas');
el.innerHTML = AREA_ORDER.map((slug, i) => {
  const a = CATALOG[slug];
  const n = a.dominios.length;
  return `<a href="c2-med#area=${slug}" class="nx-capsule active sr" style="transition-delay:${i*60}ms">
    <i class="ti ${a.icon}" style="color:var(--primary);font-size:22px;width:24px;text-align:center;flex-shrink:0;"></i>
    <div class="nx-cap-body">
      <div class="nx-cap-title">${a.label}</div>
      <div class="nx-cap-org">${n} dom / ${n*48} flashs / ${n*100} questões</div>
    </div>
    <div class="nx-pill available" id="pill-${slug}">ACESSAR</div>
  </a>`;
}).join('');

// Classifica o desempenho médio de uma área nos mesmos limiares do scorecard (c4c-scorecard.html):
// >=80% satisfatório (verde) · >=50% mediano (amarelo) · abaixo disso insuficiente (vermelho)
function areaStatusClass(pct){
  if(pct>=80) return 'satisfatorio';
  if(pct>=50) return 'mediano';
  return 'insuficiente';
}

async function getAreaScores(){
  // média do melhor score por domínio dentro da área, 0 pra domínio sem tentativa.
  const { data: { session } } = await _sb.auth.getSession();
  if (!session) return {};
  const { data: rows } = await _sb.from('study_sessions').select('area,dominio,score').eq('user_id', session.user.id);
  const scores = {};
  AREA_ORDER.forEach(slug => {
    const doms = CATALOG[slug].dominios.map(d => d.slug);
    const media = doms.reduce((sum, dslug) => {
      const best = Math.max(0, ...(rows||[]).filter(r => r.area===slug && r.dominio===dslug).map(r => parseFloat(r.score)||0));
      return sum + best;
    }, 0) / doms.length;
    scores[slug] = Math.round(media);
  });
  return scores;
}

getAreaScores().then(scores => {
  AREA_ORDER.forEach(slug => {
    const pct = scores[slug] || 0;
    const pill = document.getElementById('pill-' + slug);
    if(!pill) return;
    pill.classList.remove('available');
    pill.classList.add(areaStatusClass(pct));
  });
}).catch(e => console.warn('Erro ao carregar status das áreas:', e));

(function(){
  const scrollEl = document.querySelector('.nx-scroll');
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      document.querySelectorAll('.hero-reveal').forEach(el => el.classList.add('visible'));
    });
  });
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) { entry.target.classList.add('visible'); io.unobserve(entry.target); }
    });
  }, { root: scrollEl, threshold: 0.08 });
  document.querySelectorAll('.sr').forEach(el => io.observe(el));
})();
</script>
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");</script>
