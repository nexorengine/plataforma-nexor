<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#19212a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="nexor_med">
<title>Entrar · nexor_med</title>
<link rel="stylesheet" href="assets/nx.css?v=3">
<link rel="stylesheet" href="assets/nx-glass.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/auth.js"></script>
<style>
body{
  display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;
  background:
    radial-gradient(ellipse 70% 50% at 50% 0%, color-mix(in oklab, var(--primary) 16%, transparent), transparent 70%),
    var(--background);
  padding:24px;position:relative;overflow:hidden;
}
.login-wrap{position:relative;width:100%;max-width:400px;}
.login-card{
  position:relative;width:100%;background:rgb(from var(--surface) r g b / 0.62);
  backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);
  border:1px solid rgb(from var(--primary) r g b / 0.22);border-radius:var(--radius-2xl);
  padding:44px 38px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.06),0 30px 70px -18px color-mix(in oklab, var(--primary) 50%, transparent),0 8px 48px rgba(0,0,0,0.55);
}
.login-eyebrow{
  display:inline-flex;align-items:center;gap:7px;font-family:var(--font-display);font-size:11px;font-weight:700;
  letter-spacing:0.2em;text-transform:uppercase;color:var(--primary);
  border:1px solid color-mix(in oklab, var(--primary) 30%, transparent);background:color-mix(in oklab, var(--primary) 10%, transparent);
  border-radius:999px;padding:5px 12px;margin-bottom:20px;
}
.login-eyebrow::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
.login-logo{display:flex;align-items:center;gap:8px;margin-bottom:18px;}
.login-logo .nx-wordmark{font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--muted-foreground);letter-spacing:0.02em;}
.login-logo .nx-wordmark span{color:var(--primary);}
.login-title{font-family:var(--font-display);font-weight:700;font-size:32px;line-height:1.15;letter-spacing:-0.01em;color:var(--foreground);margin-bottom:10px;}
.login-sub{font-size:14px;line-height:1.5;color:var(--muted-foreground);margin-bottom:32px;font-weight:400;max-width:32ch;}
.login-label{font-size:11px;color:var(--muted-foreground);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:8px;display:block;font-weight:600;}
.login-input{width:100%;background:rgb(from var(--background) r g b / 0.70);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgb(from var(--primary) r g b / 0.18);border-radius:var(--radius-md);padding:14px 16px;font-size:15px;color:var(--foreground);font-family:var(--font-sans);outline:none;transition:border-color 200ms,box-shadow 200ms;box-sizing:border-box;}
.login-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in oklab, var(--primary) 18%, transparent);}
.login-input::placeholder{color:color-mix(in oklab, var(--muted-foreground) 50%, transparent);}
.login-btn{
  width:100%;margin-top:20px;padding:15px;background:var(--primary);border:none;border-radius:var(--radius-md);
  font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:0.08em;color:var(--primary-foreground);cursor:pointer;
  box-shadow:0 18px 40px -18px color-mix(in oklab, var(--primary) 60%, transparent);
  transition:transform 150ms cubic-bezier(0.16,1,0.3,1),box-shadow 200ms,background 150ms;
}
.login-btn:hover{background:color-mix(in oklab, var(--primary) 80%, white);transform:translateY(-2px);box-shadow:0 22px 48px -16px color-mix(in oklab, var(--primary) 70%, transparent);}
.login-btn:active{transform:scale(0.97);}
.login-btn:disabled{background:var(--border);color:color-mix(in oklab, var(--muted-foreground) 50%, transparent);cursor:not-allowed;transform:none;box-shadow:none;}
.login-divider{display:flex;align-items:center;gap:14px;margin:26px 0;}
.login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:var(--border);}
.login-divider span{font-size:11px;letter-spacing:0.06em;color:color-mix(in oklab, var(--muted-foreground) 50%, transparent);white-space:nowrap;}
.login-google{width:100%;padding:13px;background:rgb(from var(--surface) r g b / 0.40);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.09);border-radius:var(--radius-md);font-family:var(--font-sans);font-size:14px;color:var(--muted-foreground);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:border-color 200ms,color 200ms,background 200ms,transform 150ms;}
.login-google:hover{border-color:var(--primary);color:var(--foreground);transform:translateY(-1px);}
.login-msg{margin-top:18px;padding:13px 15px;border-radius:var(--radius-md);font-size:13px;text-align:center;display:none;}
.login-msg.success{background:rgb(from var(--success) r g b / 0.08);border:1px solid rgb(from var(--success) r g b / 0.2);color:var(--success);display:block;}
.login-msg.error{background:rgb(from var(--destructive) r g b / 0.08);border:1px solid rgb(from var(--destructive) r g b / 0.2);color:var(--destructive);display:block;}
.login-footer{margin-top:28px;text-align:center;font-size:12px;color:color-mix(in oklab, var(--muted-foreground) 50%, transparent);}
.login-footer a{color:var(--primary);text-decoration:none;}

/* entrance */
.login-wrap{opacity:0;transform:translateY(24px) scale(0.98);transition:opacity 650ms cubic-bezier(0.16,1,0.3,1),transform 650ms cubic-bezier(0.16,1,0.3,1);}
.login-wrap.visible{opacity:1;transform:translateY(0) scale(1);}
@media(prefers-reduced-motion:reduce){.login-wrap{opacity:1!important;transform:none!important;transition:none!important;}}
</style>
</head>
<body>
<div class="login-wrap" id="login-card">
  <div class="login-card">
    <span class="login-eyebrow">Acesso</span>
    <div class="login-logo">
      <div class="nx-wordmark">nexor_<span>med</span></div>
    </div>
    <div class="login-title">Bem-vindo de volta.</div>
    <div class="login-sub">Insira seu e-mail para receber o link de acesso — sem senha, sem fricção.</div>

    <label class="login-label" for="email-input">e-mail</label>
    <input class="login-input" id="email-input" type="email" placeholder="seu@email.com" autocomplete="email" inputmode="email">

    <button class="login-btn" id="btn-magic" onclick="handleMagicLink()">
      ENVIAR LINK DE ACESSO
    </button>

    <div class="login-divider"><span>ou continue com</span></div>

    <button class="login-google" onclick="Auth.loginGoogle()">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/>
        <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/>
        <path d="M3.964 10.707A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.039l3.007-2.332z" fill="#FBBC05"/>
        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.961L3.964 6.293C4.672 4.166 6.656 3.58 9 3.58z" fill="#EA4335"/>
      </svg>
      Continuar com Google
    </button>

    <div class="login-msg" id="login-msg"></div>

    <div class="login-footer">
      Não tem conta? O cadastro é automático na primeira vez.<br>
      <a href="index.html">← Voltar para o início</a>
    </div>
  </div>
</div>

<script>
// Verifica se já está logado
(async () => {
  const s = await Auth.session();
  if (s) {
    const next = new URLSearchParams(window.location.search).get('next') || 'index.html';
    window.location.href = next;
    return;
  }
  // hero reveal
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      document.getElementById('login-card').classList.add('visible');
    });
  });
})();

// Enter no input dispara o magic link
document.getElementById('email-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') handleMagicLink();
});

async function handleMagicLink() {
  const email = document.getElementById('email-input').value.trim();
  const msg = document.getElementById('login-msg');
  const btn = document.getElementById('btn-magic');

  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    msg.className = 'login-msg error';
    msg.textContent = 'Insira um e-mail válido.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'ENVIANDO...';
  msg.className = 'login-msg';

  const error = await Auth.sendMagicLink(email);

  if (error) {
    msg.className = 'login-msg error';
    msg.textContent = 'Erro ao enviar. Tente novamente.';
    btn.disabled = false;
    btn.textContent = 'ENVIAR LINK DE ACESSO';
  } else {
    msg.className = 'login-msg success';
    msg.textContent = 'Link enviado! Verifique sua caixa de entrada.';
    btn.textContent = 'LINK ENVIADO ✓';
  }
}
</script>
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");</script>
</body>
</html>
